<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button type="button" id="page-back-btn" class="page-back-btn" aria-label="Back">‹</button>
      <h1 data-i18n="brand">Famille Nah Adja Mbethe</h1>
    </div>
  </header>
  <main class="center-card" style="max-width:420px">
    <h2 id="admin-login-title" data-i18n="admin_login_title">Administrator Login</h2>
    <label id="label-username" data-i18n="login_username_label">Username<input id="adminUser" /></label>
    <label id="label-password" data-i18n="login_password_label">Password<input id="adminPwd" type="password" /></label>
    <div style="display:flex;gap:10px;margin-top:16px;align-items:center">
      <button id="adminLoginBtn" data-i18n="admin_login_btn">Login</button>
      <a href="/" class="secondary-link" data-i18n="back">Back</a>
    </div>
    <div id="adminFeedback" class="hint"></div>
    <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
      <a id="admin-forgot-password-link" href="#" class="secondary-link" data-i18n="forgot_password_link">Forgot password?</a>
    </div>
    <form id="admin-forgot-password-form" class="hidden" style="margin-top:12px">
      <label data-i18n="forgot_password_username_label">Username
        <input id="afp-username" type="text" autocomplete="username" required />
      </label>
      <button type="submit" data-i18n="forgot_password_submit_btn">Request password reset</button>
      <p id="admin-forgot-password-feedback" class="hint"></p>
    </form>
    <p style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border)">
      <span class="hint" data-i18n="owner_login_hint">Are you the platform owner?</span>
      <a href="/owner-login.html" class="secondary-link" data-i18n="owner_login_link">Owner's Login</a>
    </p>
  </main>
  <script src="/app.js"></script>
  <script>
    async function api(path, opts={}){ const merged = Object.assign({}, opts, { credentials: 'same-origin' }); const res = await fetch('/api'+path, merged); const ct = res.headers.get('content-type')||''; if (ct.includes('application/json')) return res.json(); return res.text(); }
    document.getElementById('adminLoginBtn').addEventListener('click', async ()=>{
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPwd').value;
      const f = document.getElementById('adminFeedback');
      try{
        const r = await api('/auth/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        if (r.ok) { window.location.href = '/admin.html'; }
        else f.textContent = typeof t === 'function' ? t('admin_login_failed') : 'Login failed';
      }catch(e){ f.textContent = typeof t === 'function' ? t('network_error') : 'Network error'; }
    });

    const afpLink = document.getElementById('admin-forgot-password-link');
    const afpForm = document.getElementById('admin-forgot-password-form');
    if (afpLink && afpForm){
      afpLink.addEventListener('click', (e)=>{ e.preventDefault(); afpForm.classList.toggle('hidden'); });
      afpForm.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const username = document.getElementById('afp-username').value;
        const feedback = document.getElementById('admin-forgot-password-feedback');
        feedback.textContent = typeof t === 'function' ? t('forgot_password_submitting') : '...';
        try{
          await api('/auth/admin-password-reset-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username }) });
          feedback.textContent = typeof t === 'function' ? t('forgot_password_submitted_ok') : 'Request sent.';
          afpForm.reset();
        }catch(err){ feedback.textContent = typeof t === 'function' ? t('network_error') : 'Network error'; }
      });
    }
  </script>
</body>
</html>
