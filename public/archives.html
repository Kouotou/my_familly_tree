<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Family Archives</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="brand" data-i18n="brand">Famille Nah Adja Mbethe</h1>
    <div class="toggles">
      <button id="lang-toggle">FR/EN</button>
      <button id="theme-toggle">Light/Dark</button>
    </div>
  </header>
  <main>
    <div style="padding:12px;max-width:1100px;margin:12px auto">
      <a href="/tree.html" class="secondary-link" data-i18n="archives_back_link">Back to tree</a>
      <h2 style="margin-top:10px" data-i18n="archives_title">Family Archives</h2>

      <div class="archive-tabs archive-events-bar">
        <label id="event-filter-label" data-i18n="archives_event_filter_label">Filter by event
          <select id="event-filter">
            <option value="all" data-i18n="ev_all">All</option>
            <option value="marriage" data-i18n="ev_marriage">Marriage</option>
            <option value="football_match" data-i18n="ev_football_match">Football match</option>
            <option value="meeting" data-i18n="ev_meeting">Meeting</option>
            <option value="death" data-i18n="ev_death">Death</option>
            <option value="important_gathering" data-i18n="ev_important_gathering">Important gathering</option>
            <option value="important_notice" data-i18n="ev_important_notice">Important notice</option>
            <option value="other" data-i18n="ev_other">Other</option>
          </select>
        </label>
      </div>
      <div class="archive-tabs">
        <button id="tab-photos" class="active" data-i18n="archives_tab_photos">Photos</button>
        <button id="tab-audios" data-i18n="archives_tab_audios">Audios</button>
        <button id="tab-videos" data-i18n="archives_tab_videos">Videos</button>
      </div>
      <button type="button" id="new-post-btn" class="secondary archive-new-post" data-i18n="archives_new_post">+ New post</button>

      <div id="archive-grid" class="archive-grid"></div>
    </div>
  </main>

  <!-- new post modal -->
  <div id="new-post-modal">
    <div id="new-post-card">
      <button id="new-post-close" aria-label="Close">&times;</button>
      <h3 id="new-post-title" data-i18n="np_title">New post</h3>
      <form id="new-post-form">
        <label id="np-type-label" data-i18n="np_type">Type
          <select id="np-type" name="type">
            <option value="photo" data-i18n="np_type_photo">Photo</option>
            <option value="audio" data-i18n="np_type_audio">Audio</option>
            <option value="video" data-i18n="np_type_video">YouTube video link</option>
          </select>
        </label>
        <label id="np-event-label" data-i18n="np_event_type">Event type
          <select id="np-event-type">
            <option value="" data-i18n="np_event_type_none">— none —</option>
            <option value="marriage" data-i18n="ev_marriage">Marriage</option>
            <option value="football_match" data-i18n="ev_football_match">Football match</option>
            <option value="meeting" data-i18n="ev_meeting">Meeting</option>
            <option value="death" data-i18n="ev_death">Death</option>
            <option value="important_gathering" data-i18n="ev_important_gathering">Important gathering</option>
            <option value="important_notice" data-i18n="ev_important_notice">Important notice</option>
            <option value="other" data-i18n="ev_other">Other</option>
          </select>
        </label>
        <label id="np-photo-label" data-i18n="np_file_photo">Photo file(s) — you can select more than one<input type="file" id="np-photo-file" accept="image/*" multiple /></label>
        <label id="np-audio-label" class="hidden" data-i18n="np_file_audio">Audio file<input type="file" id="np-audio-file" accept="audio/*" /></label>
        <label id="np-video-label" class="hidden" data-i18n="np_youtube_url">YouTube link<input type="text" id="np-video-url" placeholder="https://www.youtube.com/watch?v=..." /></label>
        <p id="np-edit-file-hint" class="hint hidden" data-i18n="archives_edit_keep_file_hint">Leave the file/link empty to keep the current one.</p>
        <label data-i18n="np_caption">Write something about this post<textarea id="np-caption" rows="3"></textarea></label>
        <button type="submit" id="new-post-submit-btn" data-i18n="np_submit">Submit for admin approval</button>
      </form>
      <div id="new-post-feedback" class="hint"></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script type="module">
    // Archive audio uploads go straight from the browser to Vercel Blob (bypassing the
    // platform's 4.5MB serverless request-body ceiling, which a server-routed upload would
    // hit for real voice-memo/song-clip recordings) via the client-direct-upload helper.
    // Pinned to the exact installed @vercel/blob version so the client/server protocol
    // always matches — this app has no bundler, so a versioned CDN import is used instead
    // of a local dependency.
    import { upload } from 'https://esm.sh/@vercel/blob@2.8.0/client';
    window.__blobUpload = upload;
  </script>
  <script>
    (function(){
      let currentTab = 'photo';
      let myPersonId = null;
      let editingItem = null;
      const tabs = { photo: 'tab-photos', audio: 'tab-audios', video: 'tab-videos' };

      function setActiveTab(type){
        currentTab = type;
        Object.entries(tabs).forEach(([k,id])=>{ const el=document.getElementById(id); if (el) el.classList.toggle('active', k===type); });
      }

      function formatDate(iso){
        try{ const d = new Date(iso); return d.toLocaleString(); }catch(e){ return iso || ''; }
      }

      function renderCard(item){
        const card = document.createElement('div'); card.className = 'archive-card';
        if (item.type === 'photo' && Array.isArray(item.file_paths) && item.file_paths.length){
          const media = document.createElement('div'); media.className = 'archive-photo-media';
          const mainImg = document.createElement('img'); mainImg.className = 'archive-card-media'; mainImg.src = item.file_paths[0]; mainImg.alt = '';
          media.appendChild(mainImg);
          if (item.file_paths.length > 1){
            const badge = document.createElement('span'); badge.className = 'archive-photo-count-badge'; badge.textContent = '+' + (item.file_paths.length - 1);
            media.appendChild(badge);
            const strip = document.createElement('div'); strip.className = 'archive-event-thumb-strip';
            item.file_paths.forEach((url, i)=>{
              const thumb = document.createElement('img'); thumb.src = url; thumb.alt = ''; thumb.className = i===0 ? 'active' : '';
              thumb.addEventListener('click', ()=>{
                mainImg.src = url;
                strip.querySelectorAll('img').forEach(el=> el.classList.remove('active'));
                thumb.classList.add('active');
              });
              strip.appendChild(thumb);
            });
            card.appendChild(media);
            card.appendChild(strip);
          } else {
            card.appendChild(media);
          }
        } else if (item.type === 'video' && item.youtube_id){
          // plays inline by default (click-to-load, so we're not embedding an iframe per
          // card up front); a separate link lets people open the real YouTube page if they
          // want to
          const media = document.createElement('div'); media.className = 'archive-card-media archive-video-media';
          const playBtn = document.createElement('button'); playBtn.type = 'button'; playBtn.className = 'archive-video-play'; playBtn.setAttribute('aria-label', t('archives_play_video'));
          const img = document.createElement('img'); img.src = 'https://img.youtube.com/vi/'+item.youtube_id+'/hqdefault.jpg'; img.alt = '';
          const playIcon = document.createElement('span'); playIcon.className = 'archive-video-play-icon'; playIcon.textContent = '▶';
          playBtn.appendChild(img); playBtn.appendChild(playIcon);
          playBtn.addEventListener('click', ()=>{
            const iframe = document.createElement('iframe');
            iframe.src = 'https://www.youtube.com/embed/' + item.youtube_id + '?autoplay=1';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;
            iframe.setAttribute('frameborder', '0');
            media.innerHTML = '';
            media.appendChild(iframe);
          });
          media.appendChild(playBtn);
          card.appendChild(media);
        } else if (item.type === 'audio' && item.file_path){
          const wrap = document.createElement('div'); wrap.style.padding = '18px 14px 0';
          const audio = document.createElement('audio'); audio.controls = true; audio.style.width = '100%'; audio.src = item.file_path;
          wrap.appendChild(audio); card.appendChild(wrap);
        }
        const body = document.createElement('div'); body.className = 'archive-card-body';
        if (item.event_type){ const badge = document.createElement('span'); badge.className = 'archive-event-badge'; badge.textContent = t('ev_' + item.event_type) || item.event_type; body.appendChild(badge); }
        if (item.description){ const p = document.createElement('p'); p.className = 'archive-card-caption'; p.textContent = item.description; body.appendChild(p); }
        if (item.type === 'video'){
          const ytLink = document.createElement('a'); ytLink.href = item.url; ytLink.target = '_blank'; ytLink.rel = 'noopener'; ytLink.className = 'archive-yt-link'; ytLink.textContent = t('archives_watch_on_youtube');
          body.appendChild(ytLink);
        }
        const meta = document.createElement('div'); meta.className = 'archive-card-meta';
        meta.textContent = item.posted_by_name
          ? t('archives_posted_by', { name: item.posted_by_name, date: formatDate(item.created_at) })
          : t('archives_posted_by_unknown', { date: formatDate(item.created_at) });
        body.appendChild(meta);
        if (item.person_id && item.person_id === myPersonId){
          // editing re-submits the post for admin approval, same as a new post — it won't
          // show up in this (approved-only) list again until then, matching how a brand-new
          // post also isn't visible to its author until approved
          const editBtn = document.createElement('button'); editBtn.type = 'button'; editBtn.className = 'secondary archive-edit-btn'; editBtn.textContent = t('archives_edit_btn');
          editBtn.addEventListener('click', ()=> openEditPostModal(item));
          body.appendChild(editBtn);
        }
        card.appendChild(body);
        return card;
      }

      async function loadTab(type){
        setActiveTab(type);
        const grid = document.getElementById('archive-grid');
        grid.innerHTML = '';
        try{
          const eventFilter = document.getElementById('event-filter').value;
          const qs = 'type=' + encodeURIComponent(type) + (eventFilter && eventFilter !== 'all' ? '&event_type=' + encodeURIComponent(eventFilter) : '');
          const items = await api('/archive?' + qs);
          if (!Array.isArray(items) || items.length === 0){
            const empty = document.createElement('div'); empty.className = 'archive-empty';
            empty.textContent = t('archives_empty_' + type + 's');
            grid.appendChild(empty);
            return;
          }
          items.forEach(item => grid.appendChild(renderCard(item)));
        }catch(e){ grid.innerHTML = `<div class="archive-empty">${t('error_loading')}</div>`; }
      }

      document.getElementById('tab-photos').addEventListener('click', ()=> loadTab('photo'));
      document.getElementById('tab-audios').addEventListener('click', ()=> loadTab('audio'));
      document.getElementById('tab-videos').addEventListener('click', ()=> loadTab('video'));
      document.getElementById('event-filter').addEventListener('change', ()=> loadTab(currentTab));

      // new post / edit post modal (shared — editingItem selects which mode)
      const modal = document.getElementById('new-post-modal');
      const typeSelect = document.getElementById('np-type');
      const typeLabel = document.getElementById('np-type-label');
      const photoLabel = document.getElementById('np-photo-label');
      const audioLabel = document.getElementById('np-audio-label');
      const videoLabel = document.getElementById('np-video-label');
      const editFileHint = document.getElementById('np-edit-file-hint');
      const modalTitle = document.getElementById('new-post-title');
      const submitBtn = document.getElementById('new-post-submit-btn');

      function syncTypeFields(){
        const v = typeSelect.value;
        photoLabel.classList.toggle('hidden', v !== 'photo');
        audioLabel.classList.toggle('hidden', v !== 'audio');
        videoLabel.classList.toggle('hidden', v !== 'video');
      }
      typeSelect.addEventListener('change', syncTypeFields);

      document.getElementById('new-post-btn').addEventListener('click', ()=>{
        editingItem = null;
        document.getElementById('new-post-form').reset();
        typeSelect.value = currentTab;
        typeSelect.disabled = false;
        typeLabel.classList.remove('hidden');
        editFileHint.classList.add('hidden');
        syncTypeFields();
        modalTitle.setAttribute('data-i18n', 'np_title'); modalTitle.textContent = t('np_title');
        submitBtn.setAttribute('data-i18n', 'np_submit'); submitBtn.textContent = t('np_submit');
        document.getElementById('new-post-feedback').textContent = '';
        modal.style.display = 'flex';
      });

      window.openEditPostModal = function(item){
        editingItem = item;
        document.getElementById('new-post-form').reset();
        typeSelect.value = item.type;
        typeSelect.disabled = true;
        typeLabel.classList.add('hidden');
        editFileHint.classList.remove('hidden');
        syncTypeFields();
        document.getElementById('np-caption').value = item.description || '';
        document.getElementById('np-event-type').value = item.event_type || '';
        if (item.type === 'video') document.getElementById('np-video-url').value = item.url || '';
        modalTitle.setAttribute('data-i18n', 'archives_edit_title'); modalTitle.textContent = t('archives_edit_title');
        submitBtn.setAttribute('data-i18n', 'archives_edit_submit'); submitBtn.textContent = t('archives_edit_submit');
        document.getElementById('new-post-feedback').textContent = '';
        modal.style.display = 'flex';
      };

      document.getElementById('new-post-close').addEventListener('click', ()=> modal.style.display = 'none');
      modal.addEventListener('click', (e)=>{ if (e.target === modal) modal.style.display = 'none'; });

      document.getElementById('new-post-form').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const feedback = document.getElementById('new-post-feedback');
        feedback.textContent = t('np_submitting');
        const type = typeSelect.value;
        const description = document.getElementById('np-caption').value;
        const eventType = document.getElementById('np-event-type').value || null;
        const endpoint = editingItem ? ('/api/archive/' + editingItem.id + '/edit') : '/api/archive';
        try{
          if (type === 'audio'){
            const f = document.getElementById('np-audio-file').files[0];
            if (!editingItem && !f){ feedback.textContent = t('np_error_generic'); return; }
            let fileUrl = null;
            if (f){
              // uploads straight to Blob from the browser, bypassing the server entirely for
              // the file bytes — see the module script above
              const blob = await window.__blobUpload(f.name, f, {
                access: 'public',
                handleUploadUrl: '/api/archive/upload-token',
              });
              fileUrl = blob.url;
            }
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify(editingItem ? { description, event_type: eventType, file_url: fileUrl || undefined } : { type, description, event_type: eventType, file_url: fileUrl }),
            });
            const j = await res.json();
            if (j.ok){ feedback.textContent = t('np_submitted_ok'); setTimeout(()=>{ modal.style.display='none'; loadTab(currentTab); }, 1400); }
            else feedback.textContent = j.error || t('np_error_generic');
          } else {
            const data = new FormData();
            if (!editingItem) data.append('type', type);
            data.append('description', description);
            data.append('event_type', eventType || '');
            if (type === 'photo'){
              const files = Array.from(document.getElementById('np-photo-file').files || []);
              if (!editingItem && !files.length){ feedback.textContent = t('np_error_generic'); return; }
              for (const f of files){ data.append('files', await downscalePhoto(f)); }
            } else {
              const url = document.getElementById('np-video-url').value.trim();
              if (!editingItem && !url){ feedback.textContent = t('np_error_generic'); return; }
              if (url) data.append('url', url);
            }
            const res = await fetch(endpoint, { method:'POST', body:data, credentials:'same-origin' });
            const j = await res.json();
            if (j.ok){ feedback.textContent = t('np_submitted_ok'); setTimeout(()=>{ modal.style.display='none'; loadTab(currentTab); }, 1400); }
            else feedback.textContent = j.error || t('np_error_generic');
          }
        }catch(err){ console.error(err); feedback.textContent = t('network_error'); }
      });

      (async ()=>{
        try{
          const res = await fetch('/api/auth/me', { credentials:'same-origin' });
          if (!res.ok){ window.location.href = '/'; return; }
          const me = await res.json();
          myPersonId = me.person ? me.person.id : null;
        }catch(e){}
        loadTab('photo');
      })();
    })();
  </script>
</body>
</html>
