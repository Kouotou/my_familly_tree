<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Family Tree</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
  <script>window.CULTURAL_BG_PAGE = 'tree';</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button type="button" id="page-back-btn" class="page-back-btn" aria-label="Back">‹</button>
      <button id="hamburger-btn" class="hamburger-btn" aria-label="Menu"><span></span><span></span><span></span></button>
      <h1 id="brand" data-i18n="brand">Famille Nah Adja Mbethe</h1>
    </div>
    <div class="toggles">
      <div id="notif-bell-wrap">
        <button type="button" id="notif-bell-btn" aria-label="Notifications">
          🔔<span id="notif-bell-badge" class="hidden">0</span>
        </button>
        <div id="notif-bell-dropdown" class="hidden"></div>
      </div>
      <button id="lang-toggle">FR/EN</button>
      <button id="theme-toggle">Light/Dark</button>
    </div>
  </header>

  <div id="public-events-widget" class="hidden">
    <button type="button" id="public-events-toggle">
      <span id="public-events-headline"></span>
      <span id="public-events-caret">▾</span>
    </button>
    <div id="public-events-list" class="hidden"></div>
  </div>

  <div id="sidebar-overlay"></div>
  <div id="sidebar-drawer">
    <button id="sidebar-close" aria-label="Close">&times;</button>
    <h3 data-i18n="sidebar_menu_title">Menu</h3>
    <a class="sidebar-item" href="/archives.html"><span class="icon">📁</span> <span data-i18n="sidebar_archives">Archives</span></a>
    <a class="sidebar-item" href="/feedback.html"><span class="icon">💬</span> <span data-i18n="sidebar_feedback">Feedback</span></a>
    <button type="button" class="sidebar-item" id="sidebar-search-stats-btn"><span class="icon">🔍</span> <span data-i18n="sidebar_search_stats">Search &amp; stats</span></button>
    <button type="button" class="sidebar-item" id="sidebar-tree-summary-btn"><span class="icon">🌳</span> <span data-i18n="sidebar_tree_summary">Family tree summary</span></button>
    <div class="sidebar-subpanel" id="sidebar-tree-summary-panel">
      <button type="button" id="download-tree-image" data-i18n="sidebar_download_image">Download as Image</button>
      <button type="button" id="download-tree-pdf" class="secondary" data-i18n="sidebar_download_pdf">Download as PDF</button>
      <label class="cultural-bg-toggle-label">
        <input type="checkbox" id="cultural-bg-export-toggle" checked>
        <span data-i18n="sidebar_cultural_bg_toggle">Include cultural background</span>
      </label>
    </div>
  </div>

  <main>
    <div style="padding:12px;max-width:1200px;margin:12px auto">
      <button id="back-to-landing" data-i18n="tree_logout">Logout</button>
      <div id="me-area"></div>
      <div class="tree-controls">
        <button id="center-me" data-i18n="center_me">Center on me</button>
      </div>
      <div id="tree-container">
        <svg id="tree-svg" width="1200" height="800"></svg>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script src="/cultural-bg.js"></script>
  <script src="/app.js"></script>
  <script>
    // initialize tree page: load current user and tree
    (async ()=>{
      try{
        const me = await fetch(familyPrefix()+'/api/auth/me', { credentials:'same-origin' });
        if (!me.ok){ window.location.href = familyPrefix()+'/'; return; }
        const j = await me.json();
        const person = j.person;
        if (person && typeof t === 'function') document.getElementById('me-area').textContent = t('tree_hello', { name: person.full_name });
        // call loadTree from app.js
        if (typeof loadTree === 'function') loadTree();
      }catch(e){ console.warn('Tree init error', e); }
    })();
  </script>
</body>
</html>
